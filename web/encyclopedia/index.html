<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encyclopedia · Parabellum Universe</title>
  <meta name="application-name" content="encyclopedia.parabellumuniverse.com" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="canonical" href="https://encyclopedia.parabellumuniverse.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link id="enc-css" rel="stylesheet" href="css/encyclopedia.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/" data-nav="home">
      <img class="brand-logo" src="media/logo/parabellum-logo.png" alt="Parabellum" width="220" height="48" />
      <span class="brand-sub">encyclopedia.parabellumuniverse.com</span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <button type="button" class="nav-btn is-active" data-section="aircraft">Fixed-wing</button>
      <button type="button" class="nav-btn" data-section="heli">Rotary</button>
      <button type="button" class="nav-btn" data-section="special">Special</button>
      <button type="button" class="nav-btn" data-section="domini">Domini</button>
      <button type="button" class="nav-btn" data-section="campaigns">Campaigns</button>
      <button type="button" class="nav-btn" data-section="news">News</button>
    </nav>
    <div class="top-tools">
      <label class="units-toggle" title="Unit system">
        <span>Units</span>
        <select id="unitsSelect" aria-label="Unit system">
          <option value="us">US</option>
          <option value="intl">International</option>
        </select>
      </label>
      <input id="searchInput" class="search" type="search" placeholder="Search designation, nation…" autocomplete="off" />
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-foot">
    <p><a href="https://encyclopedia.parabellumuniverse.com/">encyclopedia.parabellumuniverse.com</a> · Domini airframe registry · Airbook <code>AircraftData</code></p>
  </footer>

  <!--
    Boot: always read build.json with cache:no-store.
    If deploy id changed since last visit → reload once (auto hard refresh).
    Then load CSS/JS/media with ?v=buildId so the browser cannot serve stale catalog/cards.
  -->
  <script>
    (async function bootEncyclopedia() {
      var BUILD_KEY = "pb_enc_build";
      var id = String(Date.now());
      try {
        var res = await fetch("build.json", { cache: "no-store" });
        if (res.ok) {
          var j = await res.json();
          if (j && j.id) id = String(j.id);
        }
      } catch (err) {
        console.warn("Encyclopedia build.json fetch failed; using clock id.", err);
      }

      var prev = sessionStorage.getItem(BUILD_KEY);
      if (prev && prev !== id) {
        sessionStorage.setItem(BUILD_KEY, id);
        location.reload();
        return;
      }
      sessionStorage.setItem(BUILD_KEY, id);

      var q = "?v=" + encodeURIComponent(id);
      var css = document.getElementById("enc-css");
      if (css) css.href = "css/encyclopedia.css" + q;
      var logo = document.querySelector(".brand-logo");
      if (logo) logo.src = "media/logo/parabellum-logo.png" + q;

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src + q;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }

      try {
        await loadScript("js/data.js");
        await loadScript("js/app.js");
      } catch (err) {
        console.error("Encyclopedia boot failed", err);
        var app = document.getElementById("app");
        if (app) {
          app.innerHTML =
            "<p class='empty'>Failed to load catalog. Hard-refresh once, or check deploy.</p>";
        }
      }
    })();
  </script>
</body>
</html>
