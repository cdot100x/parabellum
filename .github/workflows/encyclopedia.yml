name: Encyclopedia site

on:
  push:
    branches: [main, master]
    paths:
      - "web/encyclopedia/**"
      - "data/aircraft/**"
      - "data/campaigns/**"
      - "data/domini/**"
      - "data/news/**"
      - "assets/ui/aircraft_cards/**"
      - "assets/ui/campaign/**"
      - "assets/ui/domini/**"
      - "assets/nations/**"
      - "tools/build_encyclopedia.py"
      - ".github/workflows/encyclopedia.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: encyclopedia-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build encyclopedia catalog + media
        run: python tools/build_encyclopedia.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/encyclopedia

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
